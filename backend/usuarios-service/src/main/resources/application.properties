
spring.application.name=usuarios-service

server.port=8082

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/pedidos360_db
spring.datasource.username=pedidos360
spring.datasource.password=pedidos360
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Configuracion de reintentos
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.multiplier=2

# Confirmacion automatica de mensajes
spring.rabbitmq.listener.simple.acknowledge-mode=auto

# Enviar mensajes rechazados a la DLQ
spring.rabbitmq.listener.simple.default-requeue-rejected=false
