
spring.application.name=pedidos-service

server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/pedidos360_db
spring.datasource.username=pedidos360
spring.datasource.password=pedidos360
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Configuración de reintentos
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.multiplier=2

# Confirmación manual de mensajes
spring.rabbitmq.listener.simple.acknowledge-mode=auto

# Enviar mensajes rechazados a la DLQ
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Seguridad JWT - Microsoft Entra ID
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/925cecc5-99bd-4a32-b207-6ffd71daada4/v2.0

app.security.audience=dfe3e673-ae97-437d-85ac-4f874cbd2a88

# Apache Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.group-id=pedidos-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Consumer JSON
spring.kafka.consumer.properties.spring.json.trusted.packages=cl.pedidos360.pedidos
spring.kafka.consumer.properties.spring.json.value.default.type=cl.pedidos360.pedidos.dto.PedidoEventDTO

# Kafka Consumer Groups
spring.kafka.consumer.group-id=pedidos-service-group
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest

# Kafka Producer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3