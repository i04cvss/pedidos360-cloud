services:
  postgres:
    image: postgres:16-alpine
    container_name: pedidos360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pedidos360_db
      POSTGRES_USER: pedidos360
      POSTGRES_PASSWORD: pedidos360
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: