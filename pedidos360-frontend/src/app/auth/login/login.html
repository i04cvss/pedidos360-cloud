
<main class="login-container">
  <section class="login-card">

    <header class="login-header">
      <span class="ornament">✦ ───── ✦</span>
      <h1>Pedidos360</h1>
      <p>GESTIÓN Y CONTROL DE PEDIDOS</p>
      <span class="ornament">✦ ───── ✦</span>
    </header>

    <div class="login-content">
      <h2>Bienvenido</h2>
      <p>
        Ingresa a tu cuenta para continuar
        con la gestión de tus pedidos.
      </p>

      <button
        type="button"
        class="login-button"
        (click)="iniciarSesion()"
      >
        Iniciar sesión con Microsoft
      </button>
    </div>

    <footer class="login-footer">
      <span>EST. 2026</span>
      <span>Pedidos360 · Plataforma de gestión</span>
    </footer>

  </section>
</main>
